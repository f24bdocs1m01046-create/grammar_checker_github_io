<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>English Grammar Checker</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <style>
    body { font-family: Arial, sans-serif; max-width:700px; margin:40px auto; padding:0 20px; }
    textarea { width:100%; height:120px; font-size:16px; padding:8px; }
    button { padding:10px 14px; font-size:16px; margin-top:10px; cursor:pointer; }
    .result { margin-top:20px; padding:12px; border-radius:6px; background:#f6f6f6; }
    .error { color:#b00020; }
  </style>
</head>
<body>
  <h1>English Grammar Checker</h1>
  <form method="POST">
    <textarea name="text" placeholder="Type a sentence..." required>{{ text or "" }}</textarea><br/>
    <button type="submit">Check Grammar</button>
  </form>

  {% if result %}
  <div class="result">
    <strong>Result:</strong>
    <div>{{ result }}</div>
    {% if score is defined %}
      <div><small>Score: {{ score }}</small></div>
    {% endif %}
  </div>
  {% endif %}

  {% if raw %}
    <h3>Raw model response</h3>
    <pre>{{ raw }}</pre>
  {% endif %}
</body>
</html>
